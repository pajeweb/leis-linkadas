name: Build Núcleo 1 anchors

on:
  push:
    paths:
      - 'normativos-manifest.json'
      - '.github/workflows/build-nucleo1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build HTML files with anchors only
        run: |
          python -m pip install beautifulsoup4 requests
          python <<'PY'
          import json, re, requests
          from pathlib import Path
          from bs4 import BeautifulSoup

          manifest=json.loads(Path('normativos-manifest.json').read_text(encoding='utf-8'))
          headers={'User-Agent':'Mozilla/5.0 (compatible; leis-linkadas/1.0)'}

          def norm(s):
              return re.sub(r'\s+',' ',s.replace('\xa0',' ')).strip()

          def slug(s):
              s=s.lower().replace('º','').replace('°','')
              s=s.replace('á','a').replace('à','a').replace('ã','a').replace('â','a').replace('é','e').replace('ê','e').replace('í','i').replace('ó','o').replace('ô','o').replace('õ','o').replace('ú','u').replace('ç','c')
              return re.sub(r'[^a-z0-9]+','-',s).strip('-')

          def anchor_doc(soup, prefix):
              used=set()
              tags=soup.find_all(['p','div','li','td','blockquote','h1','h2','h3','h4','h5'])
              current=None
              for tag in tags:
                  if tag.has_attr('id'):
                      used.add(tag['id'])
                  txt=norm(tag.get_text(' ',strip=True))
                  if not txt:
                      continue
                  m=re.match(r'^Art\\.\\s*(\\d+(?:[-–][A-Z])?)\\s*[º°.]?',txt,re.I)
                  if m:
                      art=m.group(1).replace('–','-').upper()
                      aid=f'{prefix}-art-{slug(art)}'
                      if aid not in used:
                          tag['id']=aid; used.add(aid); current=art
                      else:
                          current=art
                      continue
                  if current:
                      m=re.match(r'^§\\s*(\\d+(?:[-–][A-Z])?)\\s*[º°.]?',txt,re.I)
                      if m:
                          pid=f'{prefix}-art-{slug(current)}-par-{slug(m.group(1))}'
                          if pid not in used:
                              tag['id']=pid; used.add(pid)
                          continue
                      m=re.match(r'^([IVXLCDM]+)\\s*[—–-]\\s+',txt,re.I)
                      if m:
                          iid=f'{prefix}-art-{slug(current)}-inc-{m.group(1).lower()}'
                          if iid not in used:
                              tag['id']=iid; used.add(iid)
                          continue
                      m=re.match(r'^([a-z])\\)\\s+',txt,re.I)
                      if m:
                          lid=f'{prefix}-art-{slug(current)}-ali-{m.group(1).lower()}'
                          if lid not in used:
                              tag['id']=lid; used.add(lid)
                          continue
              return len([x for x in used if x.startswith(prefix+'-art-')])

          for n in manifest['normativos']:
              r=requests.get(n['url'],timeout=90,headers=headers)
              r.raise_for_status()
              soup=BeautifulSoup(r.text,'html.parser')
              for s in soup(['script','style','noscript']):
                  s.decompose()
              prefix=n['id']
              count=anchor_doc(soup,prefix)
              out=Path(n['dir'])/n['file']
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_text(str(soup),encoding='utf-8')
              print(n['id'],count,out)
          PY
      - name: Commit generated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add constituicao codigos leis decretos-lei
          git diff --cached --quiet || git commit -m 'Build Núcleo 1 normativos with anchors only'
          git push
