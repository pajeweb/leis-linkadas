name: Build Núcleo 1 ZIP

on:
  push:
    paths:
      - 'normativos-manifest.json'
      - '.github/workflows/build-nucleo1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build preserved-source HTML with anchors only
        run: |
          python -m pip install requests
          python <<'PY'
          import json, re, html, requests, hashlib, zipfile
          from pathlib import Path

          manifest = json.loads(Path('normativos-manifest.json').read_text(encoding='utf-8'))
          headers = {'User-Agent': 'Mozilla/5.0 (compatible; leis-linkadas/1.0)'}
          root = Path('dist/nucleo1-anchors')
          root.mkdir(parents=True, exist_ok=True)

          def slug(s):
              trans = str.maketrans('áàãâéêíóôõúç', 'aaaaeeiooouc')
              return re.sub(r'[^a-z0-9]+', '-', s.lower().replace('º','').replace('°','').translate(trans)).strip('-')

          def visible_text(block_bytes, enc):
              s = block_bytes.decode(enc, errors='replace')
              s = re.sub(r'(?is)<script\b.*?</script>|<style\b.*?</style>', ' ', s)
              s = re.sub(r'(?is)<[^>]+>', ' ', s)
              s = html.unescape(s).replace('\xa0',' ')
              return re.sub(r'\s+', ' ', s).strip()

          tag_re = re.compile(rb'(?is)<(p|li|td|th|h[1-6])\b([^>]*)>(.*?)</\1\s*>')
          id_re = re.compile(rb'(?i)\bid\s*=')

          report=[]
          failures=[]

          for n in manifest['normativos']:
              url=n['url']
              if n['id']=='dl-911-1969':
                  url='https://www.planalto.gov.br/ccivil_03/decreto-lei/1965-1988/del0911compilado.htm'
              try:
                  r=requests.get(url,timeout=90,headers=headers)
                  r.raise_for_status()
                  raw=r.content
                  enc=r.encoding or r.apparent_encoding or 'latin-1'
                  before_hrefs=len(re.findall(rb'(?i)\bhref\s*=',raw))
                  before_sha=hashlib.sha256(raw).hexdigest()
                  current=None
                  used=set()
                  count=0
                  pieces=[]
                  pos=0

                  for m in tag_re.finditer(raw):
                      full=m.group(0); tag=m.group(1); attrs=m.group(2); inner=m.group(3)
                      txt=visible_text(inner,enc)
                      anchor=None
                      ma=re.match(r'^Art\.?\s*(\d+(?:[-–][A-Z])?)\s*[º°.]?',txt,re.I)
                      if ma:
                          current=ma.group(1).replace('–','-').upper()
                          anchor=f"{n['id']}-art-{slug(current)}"
                      elif current:
                          mp=re.match(r'^§\s*(\d+(?:[-–][A-Z])?)\s*[º°.]?',txt,re.I)
                          if mp:
                              anchor=f"{n['id']}-art-{slug(current)}-par-{slug(mp.group(1))}"
                          elif re.match(r'^Parágrafo único\b',txt,re.I):
                              anchor=f"{n['id']}-art-{slug(current)}-par-unico"
                          else:
                              mi=re.match(r'^([IVXLCDM]+)\s*[—–-]\s+',txt,re.I)
                              if mi:
                                  anchor=f"{n['id']}-art-{slug(current)}-inc-{mi.group(1).lower()}"
                              else:
                                  ml=re.match(r'^([a-z])\)\s+',txt,re.I)
                                  if ml:
                                      anchor=f"{n['id']}-art-{slug(current)}-ali-{ml.group(1).lower()}"

                      if anchor and anchor not in used and not id_re.search(attrs):
                          used.add(anchor)
                          opening_end=full.find(b'>')
                          new_full=full[:opening_end] + f' id="{anchor}"'.encode('ascii') + full[opening_end:]
                          pieces.append(raw[pos:m.start()]); pieces.append(new_full); pos=m.end(); count+=1

                  pieces.append(raw[pos:])
                  out_bytes=b''.join(pieces)
                  after_hrefs=len(re.findall(rb'(?i)\bhref\s*=',out_bytes))
                  if after_hrefs!=before_hrefs:
                      raise RuntimeError(f'href count changed {before_hrefs}->{after_hrefs}')
                  anchors=re.findall((rb'\bid="'+re.escape(n['id'].encode())+rb'-[^\"]+"'),out_bytes,re.I)
                  if len(anchors)!=len(set(anchors)):
                      raise RuntimeError('duplicate generated anchors')
                  if count==0:
                      raise RuntimeError('zero anchors generated')

                  out=root/n['dir']/n['file']
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(out_bytes)
                  report.append({
                      'id':n['id'],'title':n['title'],'source':url,'file':str(out.relative_to(root)),
                      'anchors':count,'hrefs_preserved':before_hrefs,'source_sha256':before_sha,
                      'output_sha256':hashlib.sha256(out_bytes).hexdigest()
                  })
                  print(f"OK {n['id']}: {count} anchors, {before_hrefs} hrefs preserved")
              except Exception as e:
                  failures.append(f"{n['id']}: {e}")
                  print(f"ERROR {n['id']}: {e}")

          (root/'VALIDACAO.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'LEIA-ME.txt').write_text(
              'Núcleo 1 — HTMLs oficiais com âncoras adicionadas.\n'
              'Nenhum hyperlink novo é criado. Os hrefs existentes na fonte são preservados em quantidade.\n'
              'Estrutura pronta para upload no repositório leis-linkadas.\n',encoding='utf-8')

          if failures:
              raise SystemExit('Build failures:\n'+'\n'.join(failures))

          zip_path=Path('dist/nucleo1-anchors.zip')
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file():
                      z.write(p,p.relative_to(root))
          print(f'ZIP {zip_path} {zip_path.stat().st_size} bytes; {len(report)} normativos')
          PY

      - name: Commit ZIP package only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/nucleo1-anchors.zip
          git diff --cached --quiet || git commit -m 'Add Núcleo 1 anchors ZIP package'
          git push
