name: Capture official RFB IN 2186 source

on:
  push:
    paths:
      - '.github/workflows/capture-rfb-in2186.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Capture rendered official RFB source
        run: |
          python <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json

          url='https://normasinternet2.receita.fazenda.gov.br/#/consulta/externa/137341'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':2000})
              page.goto(url, wait_until='networkidle', timeout=120000)
              page.wait_for_timeout(8000)
              html=page.content()
              text=page.locator('body').inner_text()
              links=page.locator('a').evaluate_all("(els)=>els.map(a=>({text:(a.innerText||'').trim(),href:a.href}))")
              Path('rfb-2186-rendered.html').write_text(html,encoding='utf-8')
              Path('rfb-2186-body.txt').write_text(text,encoding='utf-8')
              Path('rfb-2186-links.json').write_text(json.dumps(links,ensure_ascii=False,indent=2),encoding='utf-8')
              print(text[:12000])
              print('HTML_BYTES',len(html.encode('utf-8')))
              print('TEXT_CHARS',len(text))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rfb-in2186-official-capture
          path: |
            rfb-2186-rendered.html
            rfb-2186-body.txt
            rfb-2186-links.json
          retention-days: 7
