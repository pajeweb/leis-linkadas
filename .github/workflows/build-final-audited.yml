name: Build final audited package

on:
  push:
    paths:
      - '.github/workflows/build-final-audited.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build audited package
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml charset-normalizer openpyxl
