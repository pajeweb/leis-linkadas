21','Provimento 124/2021',4280,'cnj/provimentos/provimento-124-2021.html'),('cnj-prov-140-2023','Provimento 140/2023',4955,'cnj/provimentos/provimento-140-2023.html'),('cnj-prov-142-2023','Provimento 142/2023',5006,'cnj/provimentos/provimento-142-2023.html'),('cnj-prov-144-2023','Provimento 144/2023',5058,'cnj/provimentos/provimento-144-2023.html')]

          art_re=re.compile(r'^\s*Art(?:igo)?\.?\s*(\d+(?:\s*[-–—]\s*[A-Z]{1,4})?)\s*[º°o]?\.?',re.I)
          par_re=re.compile(r'^\s*§\s*(\d+(?:\s*[-–—]\s*[A-Z]{1,4})?)\s*[º°o]?\.?',re.I)
          pu_re=re.compile(r'^\s*Parágrafo\s+único\.?',re.I)
          inc_re=re.compile(r'^\s*([IVXLCDM]+)\s*(?:[-–—]|\.)\s+',re.I)
          ali_re=re.compile(r'^\s*([a-z])\)\s+',re.I)
          item_re=re.compile(r'^\s*(\d+)\)\s+')
          def nt(s): return re.sub(r'\s*[-–—]\s*','-',s.strip()).lower()

          def add_anchors(text,prefix,prov149=False):
              soup=BeautifulSoup(text,'lxml')
              before_text=soup.get_text('',strip=False)
              href_before=[a.get('href') for a in soup.find_all('a') if a.has_attr('href')]
              if soup.head:
                  for m in soup.find_all('meta'):
                      if m.has_attr('charset'): m['charset']='utf-8'
                      if 'content' in m.attrs and 'charset=' in str(m.get('content','')).lower(): m['content']=re.sub(r'charset\s*=\s*[^;\s]+','charset=utf-8',m['content'],flags=re.I)
                  if not soup.find('meta',attrs={'charset':True}):
                      m=soup.new_tag('meta'); m['charset']='utf-8'; soup.head.insert(0,m)
              used={x.get('id') for x in soup.find_all(attrs={'id':True}) if x.get('id')}
              generated=set(); counts={'art':0,'par':0,'inc':0,'ali':0,'item':0}
              cur_art=cur_par=cur_inc=None; occ={}; in_cnn=not prov149
              def unique(base):
                  n=occ.get(base,0)+1; occ[base]=n
                  cand=base if n==1 else f'{base}-occ-{n}'
                  while cand in used or cand in generated:
                      n+=1; occ[base]=n; cand=f'{base}-occ-{n}'
                  generated.add(cand); return cand
              for tag in soup.find_all(['p','li','td','blockquote','h1','h2','h3','h4','h5','h6']):
                  txt=' '.join(tag.stripped_strings)
                  if not txt: continue
                  up=txt.upper()
                  if prov149 and 'CÓDIGO NACIONAL DE NORMAS' in up: in_cnn=True
                  pfx=prefix+'-cnn' if prov149 and in_cnn else prefix
                  base=kind=None; m=art_re.match(txt)
                  if m:
                      cur_art=nt(m.group(1)); cur_par=cur_inc=None; base=f'{pfx}-art-{cur_art}'; kind='art'
                  elif cur_art:
                      if pu_re.match(txt): cur_par='unico'; cur_inc=None; base=f'{pfx}-art-{cur_art}-par-unico'; kind='par'
                      else:
                          m=par_re.match(txt)
                          if m: cur_par=nt(m.group(1)); cur_inc=None; base=f'{pfx}-art-{cur_art}-par-{cur_par}'; kind='par'
                          else:
                              m=inc_re.match(txt)
                              if m:
                                  cur_inc=m.group(1).lower(); base=f'{pfx}-art-{cur_art}'+(f'-par-{cur_par}' if cur_par else '')+f'-inc-{cur_inc}'; kind='inc'
                              else:
                                  m=ali_re.match(txt)
                                  if m: base=f'{pfx}-art-{cur_art}'+(f'-par-{cur_par}' if cur_par else '')+(f'-inc-{cur_inc}' if cur_inc else '')+f'-ali-{m.group(1).lower()}'; kind='ali'
                                  else:
                                      m=item_re.match(txt)
                                      if m and (cur_par or cur_inc): base=f'{pfx}-art-{cur_art}'+(f'-par-{cur_par}' if cur_par else '')+(f'-inc-{cur_inc}' if cur_inc else '')+f'-item-{m.group(1)}'; kind='item'
                  if base:
                      span=soup.new_tag('span'); span['id']=unique(base); tag.insert(0,span); counts[kind]+=1
              after_text=soup.get_text('',strip=False)
              if before_text != after_text: raise RuntimeError('Texto visível mudou ao inserir âncoras')
              href_after=[a.get('href') for a in soup.find_all('a') if a.has_attr('href')]
              if href_before != href_after: raise RuntimeError('Hyperlinks mudaram ao inserir âncoras')
              if counts['art']==0: raise RuntimeError('Nenhum artigo ancorado')
              out='<!doctype html>\n'+str(soup)
              bad=re.compile(r'(Ã[\x80-\xbf]|Â[\x80-\xbfºª§]|â€|â€™|â€œ|â€�|ï»¿|\ufffd)')
              if bad.search(out): raise RuntimeError('Mojibake no HTML final')
              return out,counts,len(href_before),len(generated)

          items=[]
          items.append(('cnj-prov-149-2023','Provimento CNJ 149/2023 + CNN/CN/CNJ-Extra','https://atos.cnj.jus.br/atos/detalhar/5243','cnj/provimento-149-2023.html','cnj',True))
          for p,t,i,f in cnjdata: items.append((p,t,f'https://atos.cnj.jus.br/atos/detalhar/{i}',f,'cnj',False))
          for p,t,u,f in legal: items.append((p,t,u,f,'planalto',False))
          report=[]
          for idx,(prefix,title,url,file,kind,prov149) in enumerate(items,1):
              print(f'[{idx}/{len(items)}] {title}')
              src=resolve_cnj(url) if kind=='cnj' else resolve_planalto(url)
              out,counts,hrefs,gen=add_anchors(src['text'],prefix,prov149)
              dest=ROOT/file; dest.parent.mkdir(parents=True,exist_ok=True); dest.write_text(out,encoding='utf-8',newline='\n')
              report.append({'prefixo':prefix,'normativo':title,'arquivo':file,'fonte_canonica':src['canonical'],'fonte_resolvida':src['resolved'],'criterio_fonte':src['selection'],'rotulo_compilacao':src['label'],'encoding_origem':src['encoding'],'sha256_origem':sha(src['raw']),'sha256_saida_utf8':sha(out.encode('utf-8')),'ancoras':counts,'ancoras_geradas':gen,'hrefs_preservados':hrefs,'url_pages':BASE+file})

          # Regras de fonte conhecidas e obrigatórias
          by={r['prefixo']:r for r in report}
          checks={
            'lei-6766-1979': r'l6766compilado\.htm$',
            'lei-6015-1973': r'l6015(?:consolidado|compilad[oa])\.htm$',
            'cc-2002': r'l10406compilad[oa]\.htm$',
            'cpc-2015': r'l13105compilad[oa]\.htm$',
            'cp-1940': r'del2848compilado\.htm$',
            'cpp-1941': r'del3689compilado\.htm$',
            'ctn-1966': r'l5172compilado\.htm$',
            'dl-911-1969': r'del0911compilado\.htm$'
          }
          for k,pat in checks.items():
              if not re.search(pat,by[k]['fonte_resolvida'],re.I): raise RuntimeError(f'Fonte compilada não resolvida para {k}: {by[k]["fonte_resolvida"]}')

          # Spot checks de conteúdo/acentuação
          spot={
            'codigos/codigo-civil.html':['PRESIDENTE DA REPÚBLICA','Faço saber','personalidade civil','começa'],
            'leis/lei-6766-1979.html':['Parcelamento do Solo Urbano','Parágrafo único','Municípios'],
            'leis/lei-6015-1973.html':['Registros Públicos','eficácia']
          }
          for f,phrases in spot.items():
              s=(ROOT/f).read_text(encoding='utf-8')
              for ph in phrases:
                  if ph not in s: raise RuntimeError(f'Spot-check ausente em {f}: {ph}')

          (ROOT/'MANIFESTO-FONTES-AUDITADAS.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')

          groups={}
          for r in report: groups.setdefault(r['arquivo'].split('/')[0],[]).append(r)
          labels={'cnj':'CNJ','constituicao':'Constituição','codigos':'Códigos','leis':'Leis','decretos-lei':'Decretos-Lei'}
          sec=[]
          for g,rows in groups.items():
              lis=''.join(f'<li><a href="{htmlmod.escape(x["arquivo"])}">{htmlmod.escape(x["normativo"])}</a><small>{htmlmod.escape(x["criterio_fonte"])}</small></li>' for x in sorted(rows,key=lambda z:z['normativo']))
              sec.append(f'<section><h2>{labels.get(g,g.title())}</h2><ul>{lis}</ul></section>')
          index='''<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leis Linkadas</title><style>body{font-family:system-ui,Arial;max-width:1100px;margin:32px auto;padding:0 20px;color:#172033}input{width:100%;padding:12px;box-sizing:border-box;margin:16px 0}li{margin:8px 0}small{display:block;color:#666}</style></head><body><h1>Normativos ancorados</h1><p>Fontes oficiais auditadas e textos convertidos para UTF-8.</p><input id="q" placeholder="Filtrar normativos...">'''+''.join(sec)+'''<script>q.oninput=()=>{const s=q.value.toLowerCase();document.querySelectorAll('li').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(s)?'':'none')}</script></body></html>'''
          (ROOT/'index.html').write_text(index,encoding='utf-8')

          wb=Workbook(); ws=wb.active; ws.title='Fontes auditadas'
          headers=['Normativo','Arquivo','Fonte canônica','Fonte resolvida usada','Critério da fonte','Rótulo oficial','Encoding origem','Prefixo','URL GitHub Pages','Exemplo Art. 1','Arts','Pars','Incisos','Alíneas','Itens','Hrefs preservados','SHA256 origem','SHA256 saída']
          ws.append(headers)
          for r in report:
              p=r['prefixo']+('-cnn' if r['prefixo']=='cnj-prov-149-2023' else '')
              a=r['ancoras']; ws.append([r['normativo'],r['arquivo'],r['fonte_canonica'],r['fonte_resolvida'],r['criterio_fonte'],r['rotulo_compilacao'],r['encoding_origem'],r['prefixo'],r['url_pages'],r['url_pages']+'#'+p+'-art-1',a['art'],a['par'],a['inc'],a['ali'],a['item'],r['hrefs_preservados'],r['sha256_origem'],r['sha256_saida_utf8']])
          for c in range(1,len(headers)+1):
              ws.cell(1,c).font=Font(bold=True,color='FFFFFF'); ws.cell(1,c).fill=PatternFill('solid',fgColor='1F4E78'); ws.cell(1,c).alignment=Alignment(wrap_text=True)
          ws.freeze_panes='A2'; ws.auto_filter.ref=ws.dimensions
          widths=[42,42,62,68,28,24,18,28,68,88,10,10,10,10,10,16,68,68]
          for i,w in enumerate(widths,1): ws.column_dimensions[get_column_letter(i)].width=w
          wb.save(ROOT/'planilha-links-fontes-auditadas.xlsx')

          audit='''PACOTE LEIS LINKADAS — FONTES AUDITADAS\n\nCritérios:\n1. Para cada diploma federal, a página canônica oficial do Planalto foi aberta e o próprio link oficial “Texto consolidado”, “Texto compilado” ou “Texto atualizado” foi seguido, nessa prioridade.\n2. Quando não existe link separado, foi mantida a página oficial corrente e isso fica registrado no manifesto.\n3. Lei 6.766/1979, Lei 6.015/1973, CC, CPC, CP, CPP, CTN e DL 911 têm validação obrigatória de URL compilada/consolidada.\n4. Charset é detectado a partir do HTTP/meta e validado contra mojibake; saída é UTF-8.\n5. O texto visível e a lista de hyperlinks são comparados antes/depois da inclusão das âncoras e não podem mudar.\n6. IDs oficiais existentes não são sobrescritos; as novas âncoras são spans vazios.\n7. O build falha se qualquer normativo ficar sem artigo ancorado.\n8. MANIFESTO-FONTES-AUDITADAS.json registra exatamente qual fonte foi usada em cada arquivo.\n\nPublique o CONTEÚDO deste ZIP na raiz do repositório.\n'''
          (ROOT/'LEIA-ME-AUDITORIA.txt').write_text(audit,encoding='utf-8')
          z=Path('pacote-leis-linkadas-final-auditado.zip')
          if z.exists(): z.unlink()
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as zz:
              for p in ROOT.rglob('*'):
                  if p.is_file(): zz.write(p,p.relative_to(ROOT))
          print('PACOTE_OK',len(report),'normativos',z.stat().st_size,'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-leis-linkadas-final-auditado
          path: pacote-leis-linkadas-final-auditado.zip
          if-no-files-found: error
          retention-days: 30
