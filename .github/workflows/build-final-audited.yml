          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          session=requests.Session(); session.headers.update({'User-Agent':UA,'Accept':'text/html,application/xhtml+xml'})

          def sha(b): return hashlib.sha256(b).hexdigest()
          def norm_ws(s): return re.sub(r'\s+',' ',s or '').strip()
          def decode_bytes(raw, headers=None):
              candidates=[]
              ct=(headers or {}).get('content-type','')
              m=re.search(r'charset\s*=\s*["\']?([\w.-]+)',ct,re.I)
              if m: candidates.append(m.group(1))
              head=raw[:12000]
              for pat in [br'<meta[^>]+charset\s*=\s*["\']?([\w.-]+)', br'<meta[^>]+content=["\'][^"\']*charset=([\w.-]+)']:
                  mm=re.search(pat,head,re.I)
                  if mm:
                      try: candidates.append(mm.group(1).decode('ascii'))
                      except: pass
              best=from_bytes(raw).best()
              if best and best.encoding: candidates.append(best.encoding)
              candidates += ['utf-8','windows-1252','iso-8859-1']
              seen=[]
              for enc in candidates:
                  enc=(enc or '').strip().lower()
                  if enc and enc not in seen: seen.append(enc)
              badseq=re.compile(r'(Ã[\x80-\xbf]|Â[\x80-\xbfºª§]|â€|â€™|â€œ|â€�|ï»¿|\ufffd)')
              scored=[]
              for enc in seen:
                  try:
                      txt=raw.decode(enc)
                  except Exception:
                      continue
                  score=len(badseq.findall(txt))*1000 + txt.count('\ufffd')*10000
                  scored.append((score, enc, txt))
              if not scored: raise RuntimeError('Nenhuma decodificação possível')
              scored.sort(key=lambda x:x[0])
              score,enc,txt=scored[0]
              if '\ufffd' in txt or badseq.search(txt):
                  raise RuntimeError(f'Mojibake detectado após decodificação: {enc}')
              return txt,enc

          def fetch(url):
              r=session.get(url,timeout=90,allow_redirects=True)
              r.raise_for_status()
              txt,enc=decode_bytes(r.content,r.headers)
              return r.content,txt,enc,r.url

          def find_compiled_link(base_url,text):
              soup=BeautifulSoup(text,'lxml')
              ranked=[]
              for a in soup.find_all('a',href=True):
                  label=norm_ws(a.get_text(' ',strip=True)).lower()
                  href=a.get('href','').strip()
                  if not href or href.startswith('#') or href.lower().startswith('javascript:'): continue
                  score=None
                  if 'texto consolidado' in label: score=0
                  elif 'texto compilado' in label: score=1
                  elif 'texto atualizado' in label: score=2
                  if score is not None:
                      ranked.append((score,urljoin(base_url,href),label))
              ranked.sort(key=lambda x:x[0])
              return ranked[0] if ranked else None

          def resolve_planalto(canonical):
              raw,txt,enc,final=fetch(canonical)
              link=find_compiled_link(final,txt)
              if link:
                  _,resolved,label=link
                  raw2,txt2,enc2,final2=fetch(resolved)
                  return {'canonical':canonical,'resolved':final2,'label':label,'raw':raw2,'text':txt2,'encoding':enc2,'selection':'link-oficial-'+label}
              return {'canonical':canonical,'resolved':final,'label':'','raw':raw,'text':txt,'encoding':enc,'selection':'pagina-oficial-sem-link-separado'}

          def resolve_cnj(canonical):
              raw,txt,enc,final=fetch(canonical)
              link=find_compiled_link(final,txt)
              if link:
                  _,resolved,label=link
                  try:
                      raw2,txt2,enc2,final2=fetch(resolved)
                      return {'canonical':canonical,'resolved':final2,'label':label,'raw':raw2,'text':txt2,'encoding':enc2,'selection':'link-oficial-'+label}
                  except Exception:
                      pass
              return {'canonical':canonical,'resolved':final,'label':'','raw':raw,'text':txt,'encoding':enc,'selection':'pagina-oficial-cnj-atual'}

