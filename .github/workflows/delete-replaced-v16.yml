          done < /tmp/replaced.txt
          echo "Deleted $count replaced HTML files"
          test "$count" -eq 88
          git rm -- .github/workflows/delete-replaced-v16.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove files to be replaced by v16 package'
          git push
