name: Build pacote final corrigido v2
on:
  push:
    paths: ['.github/workflows/build-pacote-final-v2.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build package
        shell: bash
        run: |
          python -m pip install --quiet requests beautifulsoup4 lxml openpyxl
          python <<'PY'
          import json,re,hashlib,shutil,zipfile,html as h
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup,UnicodeDammit
          from openpyxl import Workbook
          from openpyxl.styles import Font,PatternFill,Alignment
          from openpyxl.utils import get_column_letter
          ROOT=Path('pacote-final'); shutil.rmtree(ROOT,ignore_errors=True); ROOT.mkdir()
          BASE='https://pajeweb.github.io/leis-linkadas/'; UA='Mozilla/5.0 (leis-linkadas/2.1)'
          def H(b): return hashlib.sha256(b).hexdigest()
          def get(url):
            r=requests.get(url,headers={'User-Agent':UA},timeout=90); r.raise_for_status(); raw=r.content
            d=UnicodeDammit(raw,is_html=True); text=d.unicode_markup; enc=d.original_encoding or 'unknown'
            if text is None or '\ufffd' in text: raise RuntimeError(f'charset inválido em {url}: {enc}')
            return raw,text,enc
          art=re.compile(r'^\s*Art(?:igo)?\.?\s*(\d+(?:\s*[-–—]\s*[A-Z]{1,4})?)\s*[º°o]?\.?',re.I)
          par=re.compile(r'^\s*§\s*(\d+(?:\s*[-–—]\s*[A-Z]{1,4})?)\s*[º°o]?\.?',re.I)
          pu=re.compile(r'^\s*Parágrafo\s+único\.?',re.I); inc=re.compile(r'^\s*([IVXLCDM]+)\s*(?:[-–—]|\.)\s+',re.I); ali=re.compile(r'^\s*([a-z])\)\s+',re.I); item=re.compile(r'^\s*(\d+)\)\s+')
          nt=lambda s:re.sub(r'\s*[-–—]\s*','-',s.strip()).lower()
          def anchor(text,prefix,is149=False):
            soup=BeautifulSoup(text,'lxml')
            if soup.head:
              m=soup.find('meta',attrs={'charset':True})
              if m:m['charset']='utf-8'
              else:
                m=soup.new_tag('meta');m['charset']='utf-8';soup.head.insert(0,m)
            href0=[a.get('href') for a in soup.find_all('a') if a.has_attr('href')]
            official_ids=[x.get('id') for x in soup.find_all(attrs={'id':True}) if x.get('id')]
            used=set(official_ids); added=[]; occ={}; counts={k:0 for k in ['art','par','inc','ali','item']}; ca=cp=ci=None; cnn=not is149
            def unique(base):
              occ[base]=occ.get(base,0)+1; n=occ[base]
              x=base if n==1 and base not in used else f'{base}-occ-{max(2,n)}'
              while x in used: n+=1; x=f'{base}-occ-{n}'
              used.add(x);added.append(x);return x
            for tag in soup.find_all(['p','li','td','blockquote','h1','h2','h3','h4','h5','h6']):
              t=' '.join(tag.stripped_strings)
              if not t: continue
              if is149 and 'CÓDIGO NACIONAL DE NORMAS' in t.upper(): cnn=True
              pfx=prefix+'-cnn' if is149 and cnn else prefix; base=kind=None
              m=art.match(t)
              if m: ca=nt(m.group(1));cp=ci=None;base=f'{pfx}-art-{ca}';kind='art'
              elif ca and pu.match(t): cp='unico';ci=None;base=f'{pfx}-art-{ca}-par-unico';kind='par'
              else:
                m=par.match(t)
                if m and ca: cp=nt(m.group(1));ci=None;base=f'{pfx}-art-{ca}-par-{cp}';kind='par'
                else:
                  m=inc.match(t)
                  if m and ca: ci=m.group(1).lower();base=f'{pfx}-art-{ca}'+(f'-par-{cp}' if cp else '')+f'-inc-{ci}';kind='inc'
                  else:
                    m=ali.match(t)
                    if m and ca: base=f'{pfx}-art-{ca}'+(f'-par-{cp}' if cp else '')+(f'-inc-{ci}' if ci else '')+f'-ali-{m.group(1).lower()}';kind='ali'
                    else:
                      m=item.match(t)
                      if m and ca and (cp or ci): base=f'{pfx}-art-{ca}'+(f'-par-{cp}' if cp else '')+(f'-inc-{ci}' if ci else '')+f'-item-{m.group(1)}';kind='item'
              if base:
                sp=soup.new_tag('span');sp['id']=unique(base);tag.insert(0,sp);counts[kind]+=1
            href1=[a.get('href') for a in soup.find_all('a') if a.has_attr('href')]
            if href0!=href1: raise RuntimeError('hyperlinks oficiais alterados')
            if len(added)!=len(set(added)) or any(x in set(official_ids) for x in added): raise RuntimeError('conflito em IDs adicionados')
            out='<!doctype html>\n'+str(soup)
            if '\ufffd' in out: raise RuntimeError('U+FFFD no resultado')
            return out,counts,len(href0),len(official_ids),len(added)
          val=json.load(open('VALIDACAO.json',encoding='utf-8')); cnjm=json.load(open('MANIFESTO-CNJ-REFERENCIADOS.json',encoding='utf-8'))
          items=[{'title':'Provimento CNJ 149/2023 + CNN/CN/CNJ-Extra','source':'https://atos.cnj.jus.br/atos/detalhar/5243','file':'cnj/provimento-149-2023.html','prefix':'cnj-prov-149-2023','status':'Texto oficial CNJ atual','is149':True}]
          for x in cnjm['itens']:
            nome=('Resolução Conjunta' if x['tipo']=='resolucao-conjunta' else 'Resolução' if x['tipo']=='resolucao' else 'Provimento')+f" {x['numero']}/{x['ano']}"
            items.append({'title':nome,'source':x['fonte_oficial'],'file':x['arquivo'],'prefix':x['prefixo'],'status':x.get('situacao','')})
          for x in val: items.append({'title':x['title'],'source':x['source'],'file':x['file'],'prefix':x['id'],'status':'Texto oficial atual'})
          rep=[]
          for n,x in enumerate(items,1):
            print(f'[{n}/{len(items)}] {x["title"]}',flush=True);raw,text,enc=get(x['source']);out,c,href,off,add=anchor(text,x['prefix'],x.get('is149',False));p=ROOT/x['file'];p.parent.mkdir(parents=True,exist_ok=True);p.write_text(out,encoding='utf-8')
            rep.append({**x,'encoding_origem':enc,'sha256_origem':H(raw),'sha256_saida':H(out.encode()),'ancoras':c,'hrefs_preservados':href,'ids_oficiais':off,'ids_adicionados':add,'url_pages':BASE+x['file']})
          # índice
          groups={}
          for r in rep:groups.setdefault(r['file'].split('/')[0],[]).append(r)
          labels={'cnj':'CNJ','constituicao':'Constituição','codigos':'Códigos','leis':'Leis','decretos-lei':'Decretos-Lei'};sections=[]
          for g,rows in groups.items(): sections.append('<section><h2>'+labels.get(g,g)+'</h2><ul>'+''.join(f'<li><a href="{h.escape(r["file"])}">{h.escape(r["title"])}</a> <small>{h.escape(r["status"])}</small></li>' for r in sorted(rows,key=lambda z:z['title']))+'</ul></section>')
          (ROOT/'index.html').write_text('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leis Linkadas</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:32px auto;padding:0 20px}input{width:100%;padding:12px;box-sizing:border-box}li{margin:7px 0}small{color:#666;display:block}</style></head><body><h1>Normativos ancorados</h1><input id="q" placeholder="Filtrar...">'+''.join(sections)+'<script>q.oninput=()=>{let s=q.value.toLowerCase();document.querySelectorAll("li").forEach(x=>x.style.display=x.innerText.toLowerCase().includes(s)?"":"none")}</script></body></html>',encoding='utf-8')
          (ROOT/'MANIFESTO.json').write_text(json.dumps(rep,ensure_ascii=False,indent=2),encoding='utf-8')
          (ROOT/'LEIA-ME.txt').write_text('PACOTE LEIS LINKADAS — UTF-8 / TEXTOS OFICIAIS ATUAIS\n\nCopie o conteúdo deste pacote para a raiz do repositório. Os normativos preservam hyperlinks oficiais e recebem somente âncoras adicionais. Consulte MANIFESTO.json para fonte, encoding e validações.\n',encoding='utf-8')
          wb=Workbook();ws=wb.active;ws.title='Normativos';hdr=['Normativo','Situação','Arquivo','URL GitHub Pages','Prefixo','Exemplo Art. 1','Fonte oficial','Encoding','Arts','Pars','Incisos','Alíneas','Itens','Hrefs oficiais'];ws.append(hdr)
          for r in rep:
            px=r['prefix']+('-cnn' if r.get('is149') else '');ws.append([r['title'],r['status'],r['file'],r['url_pages'],r['prefix'],r['url_pages']+'#'+px+'-art-1',r['source'],r['encoding_origem'],r['ancoras']['art'],r['ancoras']['par'],r['ancoras']['inc'],r['ancoras']['ali'],r['ancoras']['item'],r['hrefs_preservados']])
          for c in range(1,len(hdr)+1):ws.cell(1,c).font=Font(bold=True);ws.cell(1,c).fill=PatternFill('solid',fgColor='D9EAF7');ws.cell(1,c).alignment=Alignment(wrap_text=True)
          ws.freeze_panes='A2';ws.auto_filter.ref=ws.dimensions
          for i,w in enumerate([42,18,46,65,30,85,70,16,10,10,10,10,10,14],1):ws.column_dimensions[get_column_letter(i)].width=w
          wb.save(ROOT/'planilha-links.xlsx')
          z=Path('pacote-leis-linkadas-corrigido.zip');z.unlink(missing_ok=True)
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as f:
            for p in ROOT.rglob('*'):
              if p.is_file():f.write(p,p.relative_to(ROOT))
          print('PACOTE OK',len(rep),z.stat().st_size,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pacote-leis-linkadas-corrigido-v2
          path: pacote-leis-linkadas-corrigido.zip
          retention-days: 30
