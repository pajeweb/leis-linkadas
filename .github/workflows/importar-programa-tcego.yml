name: Importar normativos do Programa TCE-GO
on:
  push:
    paths:
      - scripts/importar_programa_tcego.py
      - .github/workflows/importar-programa-tcego.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 charset-normalizer
      - name: Importar documentos oficiais e ancorar artigos
        run: python scripts/importar_programa_tcego.py
      - name: Publicar apenas os documentos validados e índice sincronizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html leis leis-complementares decretos goias tce-go
          if ! git diff --cached --quiet; then
            git commit -m "Incluir normativos oficiais ancorados do Programa TCE-GO e atualizar index"
            git push
          fi
