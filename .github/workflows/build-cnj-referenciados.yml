name: Build CNJ referenced acts ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-cnj-referenciados.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch official CNJ acts and add anchors
        run: |
          python -m pip install requests beautifulsoup4
          python <<'PY'
          import html, json, re, shutil, zipfile
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          BASE='https://atos.cnj.jus.br/atos/detalhar/5243'
          H={'User-Agent':'Mozilla/5.0 (compatible; leis-linkadas/1.0)'}

          # Acts expressly identified by Prov. 149 as non-incorporated/referenced,
          # plus Resolutions listed as correlata because Resolutions are not incorporable
          # into a Corregedoria Provimento.
          targets = [
            # Resoluções CNJ / CNJ-CNMP
            ('resolucao',20,2006), ('resolucao',35,2007), ('resolucao',67,2009),
            ('resolucao',80,2009), ('resolucao',81,2009), ('resolucao',125,2010),
            ('resolucao',155,2012), ('resolucao',175,2013), ('resolucao',227,2016),
            ('resolucao',228,2016), ('resolucao',269,2018), ('resolucao',401,2021),
            ('resolucao',402,2021), ('resolucao-conjunta',3,2012),
            # Provimentos preservados total/parcialmente e remetidos pelo Prov. 149
            ('provimento',12,2010), ('provimento',14,2011), ('provimento',16,2012),
            ('provimento',25,2012), ('provimento',26,2012), ('provimento',39,2014),
            ('provimento',44,2015), ('provimento',50,2015), ('provimento',56,2016),
            ('provimento',62,2017), ('provimento',63,2017), ('provimento',73,2018),
            ('provimento',74,2018), ('provimento',79,2018), ('provimento',81,2018),
            ('provimento',82,2019), ('provimento',89,2019), ('provimento',103,2020),
            ('provimento',107,2020), ('provimento',109,2020), ('provimento',115,2021),
            ('provimento',122,2021), ('provimento',124,2021), ('provimento',140,2023),
            ('provimento',142,2023), ('provimento',144,2023),
          ]

          def norm(s):
            return re.sub(r'\s+',' ', html.unescape(s or '')).strip()

          def plain(fragment):
            x=re.sub(r'(?is)<script\b.*?</script>|<style\b.*?</style>',' ',fragment)
            x=re.sub(r'(?s)<[^>]+>',' ',x)
            return norm(x.replace('&nbsp;',' '))

          def prefix(kind,num,year):
            k={'resolucao':'cnj-res','resolucao-conjunta':'cnj-res-conj','provimento':'cnj-prov'}[kind]
            return f'{k}-{num}-{year}'

          def add_unique(used, base):
            if base not in used:
              used.add(base); return base
            i=2
            while f'{base}-occ-{i}' in used: i+=1
            x=f'{base}-occ-{i}'; used.add(x); return x

          BLOCK=re.compile(r'(?is)<(?P<tag>p|li|td|blockquote|h1|h2|h3|h4|h5|h6)\b(?P<attrs>[^>]*)>(?P<body>.*?)</(?P=tag)\s*>')

          def anchor_raw(src, pref):
            href_before=re.findall(r'(?is)\bhref\s*=\s*(["\'])(.*?)\1', src)
            used=set(re.findall(r'(?is)\bid\s*=\s*(["\'])(.*?)\1', src))
            used={v for _,v in used}
            cur_art=cur_par=cur_inc=None
            counts=Counter()

            def repl(m):
              nonlocal cur_art,cur_par,cur_inc
              attrs=m.group('attrs'); body=m.group('body'); txt=plain(body)
              if not txt: return m.group(0)
              anchor=None
              ma=re.match(r'^Art(?:igo)?\.?\s*(\d+(?:\s*[-–—]\s*[A-Z]{1,4})?)\s*[º°o]?\.?',txt,re.I)
              if ma:
                cur_art=re.sub(r'\s+','',ma.group(1).replace('–','-').replace('—','-')).lower()
                cur_par=cur_inc=None
                anchor=add_unique(used,f'{pref}-art-{cur_art}')
                counts['art']+=1
              elif cur_art:
                mp=re.match(r'^§\s*(\d+(?:\s*[-–—]\s*[A-Z]{1,4})?)\s*[º°o]?\.?',txt,re.I)
                if mp:
                  cur_par=re.sub(r'\s+','',mp.group(1).replace('–','-').replace('—','-')).lower(); cur_inc=None
                  anchor=add_unique(used,f'{pref}-art-{cur_art}-par-{cur_par}'); counts['par']+=1
                elif re.match(r'^Parágrafo\s+único\b',txt,re.I):
                  cur_par='unico'; cur_inc=None
                  anchor=add_unique(used,f'{pref}-art-{cur_art}-par-unico'); counts['par']+=1
                else:
                  mi=re.match(r'^([IVXLCDM]+)\s*(?:[-–—]|\.)\s+',txt,re.I)
                  if mi:
                    cur_inc=mi.group(1).lower()
                    base=f'{pref}-art-{cur_art}' + (f'-par-{cur_par}' if cur_par else '') + f'-inc-{cur_inc}'
                    anchor=add_unique(used,base); counts['inc']+=1
                  else:
                    ml=re.match(r'^([a-z])\)\s+',txt,re.I)
                    if ml:
                      base=f'{pref}-art-{cur_art}' + (f'-par-{cur_par}' if cur_par else '') + (f'-inc-{cur_inc}' if cur_inc else '') + f'-ali-{ml.group(1).lower()}'
                      anchor=add_unique(used,base); counts['ali']+=1
                    else:
                      mit=re.match(r'^(\d+)\)\s+',txt)
                      if mit:
                        base=f'{pref}-art-{cur_art}' + (f'-par-{cur_par}' if cur_par else '') + (f'-inc-{cur_inc}' if cur_inc else '') + f'-item-{mit.group(1)}'
                        anchor=add_unique(used,base); counts['item']+=1
              if not anchor: return m.group(0)
              opening=f'<{m.group("tag")}{attrs}>'
              if re.search(r'(?i)\bid\s*=',opening):
                # preserve the source id and add a zero-width alias span (not a hyperlink)
                return opening + f'<span id="{anchor}"></span>' + body + f'</{m.group("tag")}>'
              return f'<{m.group("tag")}{attrs} id="{anchor}">' + body + f'</{m.group("tag")}>'

            out=BLOCK.sub(repl,src)
            href_after=re.findall(r'(?is)\bhref\s*=\s*(["\'])(.*?)\1', out)
            if Counter(v for _,v in href_before) != Counter(v for _,v in href_after):
              raise RuntimeError('hrefs changed')
            ids=re.findall(r'(?is)\bid\s*=\s*(["\'])(.*?)\1',out)
            vals=[v for _,v in ids]
            if len(vals)!=len(set(vals)):
              raise RuntimeError('duplicate ids')
            return out, dict(counts), len(href_before), len(vals)

          # Discover official detail URLs from the Prov. 149 page itself.
          r=requests.get(BASE,headers=H,timeout=90); r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          anchors=[]
          for a in soup.find_all('a',href=True):
            txt=norm(a.get_text(' ',strip=True)).lower()
            href=urljoin(BASE,a['href'])
            if '/atos/detalhar/' in href:
              anchors.append((txt,href))

          def find_url(kind,num,year):
            candidates=[]
            for txt,u in anchors:
              if kind=='provimento' and 'provimento' not in txt: continue
              if kind=='resolucao' and ('resolu' not in txt or 'conjunta' in txt): continue
              if kind=='resolucao-conjunta' and not ('resolu' in txt and 'conjunta' in txt): continue
              if re.search(rf'\b{num}\b',txt) and str(year) in txt:
                candidates.append(u)
            if not candidates:
              # fallback: number-only, used only when the CNJ page omits year in anchor text
              for txt,u in anchors:
                if kind=='provimento' and 'provimento' not in txt: continue
                if kind=='resolucao' and ('resolu' not in txt or 'conjunta' in txt): continue
                if kind=='resolucao-conjunta' and not ('resolu' in txt and 'conjunta' in txt): continue
                if re.search(rf'\b{num}\b',txt): candidates.append(u)
            return candidates[0] if candidates else None

          root=Path('dist/cnj-referenciados-ancorados')
          if root.exists(): shutil.rmtree(root)
          (root/'cnj'/'resolucoes').mkdir(parents=True)
          (root/'cnj'/'provimentos').mkdir(parents=True)
          report=[]; failures=[]

          for kind,num,year in targets:
            u=find_url(kind,num,year)
            if not u:
              failures.append(f'{kind} {num}/{year}: URL não encontrada na página do Provimento 149')
              continue
            rr=requests.get(u,headers=H,timeout=90); rr.raise_for_status()
            rr.encoding=rr.apparent_encoding or rr.encoding
            src=rr.text
            pref=prefix(kind,num,year)
            out,counts,hrefs,ids=anchor_raw(src,pref)
            status='não identificado'
            m=re.search(r'(?is)Situação\s*</[^>]+>\s*<[^>]+>\s*([^<]+)',src)
            if m: status=norm(m.group(1))
            folder='provimentos' if kind=='provimento' else 'resolucoes'
            fname=(f'provimento-{num}-{year}.html' if kind=='provimento' else (f'resolucao-conjunta-{num}-{year}.html' if kind=='resolucao-conjunta' else f'resolucao-{num}-{year}.html'))
            p=root/'cnj'/folder/fname
            p.write_text(out,encoding='utf-8')
            report.append({'tipo':kind,'numero':num,'ano':year,'arquivo':str(p.relative_to(root)),'prefixo':pref,'fonte_oficial':u,'situacao':status,'ancoras':counts,'hrefs_originais_preservados':hrefs,'ids_total':ids})
            print('OK',kind,num,year,counts,u)

          # Prov. 124 is mentioned in the explanatory note as exhausted/no reason for reference;
          # Prov. 74 may now be revoked. Keep both in the historical set, with status in manifest.
          manifest={
            'base_analise':BASE,
            'criterio':'Resoluções correlatas (não incorporáveis ao Provimento) e Provimentos que a Exposição de Motivos do Provimento 149 declara preservados total/parcialmente ou objeto de remissão.',
            'observacoes':["Os atos são cópias das páginas oficiais do CNJ com apenas IDs/âncoras adicionados; hrefs preexistentes são preservados.","A situação jurídica exibida é a que foi possível extrair da página oficial no momento da geração; conferir atos revogados/suspensos antes de uso jurídico."],
            'itens':report,
            'falhas':failures
          }
          (root/'MANIFESTO.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          (root/'LEIA-ME.txt').write_text('CNJ — atos referenciados pelo Provimento 149/2023\n\nArquivos oficiais com âncoras adicionadas. Nenhum hyperlink novo é criado.\nVeja MANIFESTO.json para fonte oficial, prefixo e situação de cada ato.\n',encoding='utf-8')
          if failures:
            print('\n'.join(failures))
            raise SystemExit('Há atos não localizados; ZIP não será publicado incompleto.')

          zip_path=Path('dist/cnj-referenciados-ancorados.zip')
          if zip_path.exists(): zip_path.unlink()
          with zipfile.ZipFile(zip_path,'w',zipfile.ZIP_DEFLATED) as z:
            for p in root.rglob('*'):
              if p.is_file(): z.write(p,p.relative_to(root.parent))
          print('ZIP',zip_path,zip_path.stat().st_size,'bytes',len(report),'atos')
          PY
      - name: Commit ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/cnj-referenciados-ancorados.zip
          git diff --cached --quiet || git commit -m 'Add anchored CNJ referenced acts ZIP'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: cnj-referenciados-ancorados
          path: dist/cnj-referenciados-ancorados.zip
