name: Add anchored RFB IN 2186/2024

on:
  push:
    paths:
      - '.github/workflows/add-rfb-in2186.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --quiet playwright beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Fetch official current text, anchor and update index
        shell: bash
        run: |
          python <<'PY'
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          from pathlib import Path
          import re, html

          OFFICIAL='https://normasinternet2.receita.fazenda.gov.br/#/consulta/externa/137341'
          PREFIX='rfb-in-2186-2024'
          OUT=Path('rfb/instrucao-normativa-2186-2024.html')

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':2000})
              page.goto(OFFICIAL, wait_until='networkidle', timeout=120000)
              page.wait_for_timeout(8000)
              page.get_by_text('Vigente', exact=True).click()
              page.wait_for_timeout(5000)
              rendered=page.content()
              browser.close()

          soup=BeautifulSoup(rendered,'html.parser')
          container=soup.select_one('.conteudo-ato')
          if not container:
              raise RuntimeError('Conteúdo oficial do ato não localizado.')

          epig=' '.join(container.select_one('.epigrafe-ato').stripped_strings)
          pub=' '.join(container.select_one('.titulo-publicacao').stripped_strings)
          if '2186' not in epig or '12 de abril de 2024' not in epig:
              raise RuntimeError('Epígrafe oficial inesperada: '+epig)

          hist=[]
          for a in container.select('.historico a'):
              href=a.get('href','')
              if href.startswith('#/'):
                  href='https://normasinternet2.receita.fazenda.gov.br/'+href
              hist.append((' '.join(a.stripped_strings),href))
          hist_text=' '.join(t for t,_ in hist)
          if '2202' not in hist_text or 'Retificado' not in hist_text:
              raise RuntimeError('Histórico oficial não contém retificação e IN RFB 2202/2024.')

          roman_re=re.compile(r'^([IVXLCDM]+)\\s*[-–—]')
          ali_re=re.compile(r'^([a-z])\\)')
          art_re=re.compile(r'^Art\\.\\s*(\\d+)',re.I)

          current_art=None; current_par=None; current_inc=None
          seen=set(); out_parts=[]; source_hrefs=[]

          segments=[]
          for div in container.select('app-exibir-visao .segmento'):
              span=div.select_one('.conteudo-segmento-ato')
              if not span:
                  continue
              title=span.get('title','')
              typ=title.split('Tipo:')[-1].strip() if 'Tipo:' in title else ''
              txt=' '.join(span.stripped_strings)
              segments.append((div,span,typ,txt))

          for div,span,typ,txt in segments:
              anchor=None
              if typ=='Artigo':
                  m=art_re.match(txt)
                  if not m: raise RuntimeError('Artigo não reconhecido: '+txt)
                  current_art=m.group(1); current_par=None; current_inc=None
                  anchor=f'{PREFIX}-art-{current_art}'
              elif typ=='Parágrafo':
                  if not current_art: raise RuntimeError('Parágrafo sem artigo.')
                  if txt.lower().startswith('parágrafo único'):
                      par='unico'
                  else:
                      m=re.match(r'^§\\s*(\\d+)º',txt)
                      if not m: raise RuntimeError('Parágrafo não reconhecido: '+txt)
                      par=m.group(1)
                  current_par=par; current_inc=None
                  anchor=f'{PREFIX}-art-{current_art}-par-{par}'
              elif typ=='Inciso':
                  if not current_art: raise RuntimeError('Inciso sem artigo.')
                  m=roman_re.match(txt)
                  if not m: raise RuntimeError('Inciso não reconhecido: '+txt)
                  inc=m.group(1).lower(); current_inc=inc
                  anchor=f'{PREFIX}-art-{current_art}' + (f'-par-{current_par}' if current_par else '') + f'-inc-{inc}'
              elif typ=='Alínea':
                  if not current_art or not current_inc: raise RuntimeError('Alínea sem inciso.')
                  m=ali_re.match(txt)
                  if not m: raise RuntimeError('Alínea não reconhecida: '+txt)
                  anchor=f'{PREFIX}-art-{current_art}' + (f'-par-{current_par}' if current_par else '') + f'-inc-{current_inc}-ali-{m.group(1).lower()}'
              elif typ in ('Capítulo','Ementa','Não Identificado','Fecho'):
                  pass
              else:
                  raise RuntimeError(f'Tipo inesperado: {typ}: {txt}')

              if anchor:
                  if anchor in seen: raise RuntimeError('ID duplicado: '+anchor)
                  seen.add(anchor)

              for a in span.select('a[href]'):
                  source_hrefs.append(a['href'])

              inner=''.join(str(x) for x in span.contents)
              inner=re.sub(r'href="#/consulta/externa/(\\d+)"',
                           r'href="https://normasinternet2.receita.fazenda.gov.br/#/consulta/externa/\\1"',inner)
              style=div.get('style','')
              cls='segmento '+typ.lower().translate(str.maketrans('ãíáóé','aiaoe')).replace(' ','-')
              aid=f'<span id="{anchor}"></span>' if anchor else ''
              out_parts.append(f'<div class="{cls}" style="{html.escape(style,quote=True)}">{aid}{inner}</div>')

          for n in range(1,12):
              if f'{PREFIX}-art-{n}' not in seen:
                  raise RuntimeError(f'Art. {n} sem âncora.')
          if len(seen) != 42:
              raise RuntimeError(f'Quantidade inesperada de âncoras: {len(seen)}')

          # Validate the consolidated text specifically affected by IN RFB 2202/2024.
          txt_current='\n'.join(t for _,_,_,t in segments)
          if 'Art. 9º As declarações relativas a operações imobiliárias cujos documentos foram lavrados' not in txt_current:
              raise RuntimeError('Redação vigente do art. 9º não encontrada.')
          if 'Instrução Normativa RFB nº 1.139' in txt_current:
              raise RuntimeError('Redação retificada do art. 10 ainda contém IN RFB 1.139.')

          history_html=''.join(
              f'<div><a href="{html.escape(href,quote=True)}">{html.escape(text)}</a></div>'
              for text,href in hist
          )
          doc=(
              '<!doctype html>\\n'
              '<html lang="pt-BR">\\n'
              '<head>\\n'
              '<meta charset="utf-8">\\n'
              '<meta name="viewport" content="width=device-width,initial-scale=1">\\n'
              '<title>Instrução Normativa RFB nº 2.186/2024</title>\\n'
              '<style>\\n'
              'body{font-family:Arial,Helvetica,sans-serif;max-width:1000px;margin:32px auto;padding:0 24px;color:#111;line-height:1.45}\\n'
              'header{margin-bottom:28px}\\n'
              'h1{font-size:1.25rem;text-align:center;text-transform:uppercase;margin:0 0 12px}\\n'
              '.publicacao,.ementa{text-align:center;margin:10px 0}\\n'
              '.historico{margin:18px 0;font-size:.95rem}\\n'
              '.segmento{margin:10px 0}\\n'
              '.capitulo{font-weight:normal;margin-top:24px}\\n'
              'a{color:#0645ad}\\n'
              '</style>\\n'
              '</head>\\n'
              '<body>\\n'
              '<header>\\n'
              '<h1>INSTRUÇÃO NORMATIVA RFB Nº 2.186, DE 12 DE ABRIL DE 2024</h1>\\n'
              f'<div class="publicacao">{html.escape(pub)}</div>\\n'
              f'<div class="historico"><strong>Histórico de alterações</strong>{history_html}</div>\\n'
              '</header>\\n'
              + ''.join(out_parts) + '\\n'
              '<footer><p><em>* Este texto não substitui o publicado oficialmente.</em></p></footer>\\n'
              '</body>\\n'
              '</html>\\n'
          )
          OUT.parent.mkdir(parents=True,exist_ok=True)
          OUT.write_text(doc,encoding='utf-8',newline='\n')

          # Re-open final output and verify IDs and preservation of official hyperlinks.
          final=BeautifulSoup(OUT.read_text(encoding='utf-8'),'html.parser')
          ids=[x.get('id') for x in final.select('[id]')]
          if len(ids)!=len(set(ids)): raise RuntimeError('IDs duplicados no HTML final.')
          final_hrefs=[a['href'] for a in final.select('a[href]')]
          normalized_source=[('https://normasinternet2.receita.fazenda.gov.br/'+h if h.startswith('#/') else h) for h in source_hrefs]
          for h in normalized_source:
              if h not in final_hrefs:
                  raise RuntimeError('Hyperlink oficial perdido: '+h)
          for _,h in hist:
              if h not in final_hrefs:
                  raise RuntimeError('Hyperlink de histórico perdido: '+h)

          # Update index without reserializing the existing document.
          idx=Path('index.html')
          text=idx.read_text(encoding='utf-8')
          href='rfb/instrucao-normativa-2186-2024.html'
          entry='<section><h2>RFB</h2><h3>Instruções Normativas</h3><ul><li><a href="'+href+'">Instrução Normativa RFB 2.186/2024 — Declaração sobre Operações Imobiliárias (DOI)</a><small>texto-vigente-oficial-rfb</small></li></ul></section>'
          if href not in text:
              marker='<section><h2>Constituição</h2>'
              if marker not in text:
                  raise RuntimeError('Ponto de inserção no index.html não localizado.')
              text=text.replace(marker,entry+marker,1)
              idx.write_text(text,encoding='utf-8',newline='\n')

          if href not in idx.read_text(encoding='utf-8'):
              raise RuntimeError('Link RFB não incluído no index.')
          print('FONTE_OFICIAL',OFFICIAL)
          print('EPIGRAFE',epig)
          print('PUBLICACAO',pub)
          print('HISTORICO',hist)
          print('ANCHORS',len(seen))
          print('SOURCE_LINKS_PRESERVED',len(normalized_source)+len(hist))
          print('OUTPUT',OUT)
          PY
      - name: Commit validated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rfb/instrucao-normativa-2186-2024.html index.html
          git diff --cached --check
          git commit -m 'Add anchored RFB IN 2186/2024'
          git push
